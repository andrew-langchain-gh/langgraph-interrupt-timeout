[project]
name = "langgraph-interrupt-timeout"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph-sdk>=0.4.5",
    "langsmith>=0.14.1",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.32",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
